services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tasks_app
      POSTGRES_PASSWORD: tasks_local_password
      POSTGRES_DB: ktor_tasks
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - tasks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_app -d ktor_tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tasks_pgdata:
