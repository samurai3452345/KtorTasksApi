name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tasks_app
          POSTGRES_PASSWORD: tasks_local_password
          POSTGRES_DB: ktor_tasks
        ports: ['55434:5432']
        options: >-
          --health-cmd "pg_isready -U tasks_app -d ktor_tasks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify
